{% set python_min = "3.11" %}
{% set name = "myst-parser" %}
{% set version = "5.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 749cc02793f2be6b984b0b59b1fe33b6ed61d77644499b85db436d0d20117fa4

build:
  number: 0
  entry_points:
    - myst-benchmark = myst_parser.cli.benchmark:main
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '


requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3.4,<5
  run:
    - docutils >=0.20,<0.24
    - markdown-it-py >=4.2.0,<4.3.0
    - mdit-py-plugins >=0.7.0,<0.8
    - jinja2
    - python >={{ python_min }}
    - pyyaml
    - sphinx >=8,<10

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - myst_parser
    - myst_parser.cli

about:
  home: https://github.com/ExecutableBookProject/MyST-Parser
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: An extended commonmark compliant parser, with bridges to docutils & sphinx.
  doc_url: https://myst-parser.readthedocs.io

extra:
  recipe-maintainers:
    - dopplershift
    - choldgraf
